<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Pipeline Network Grid Lines -->
  <path d="M 120 180 L 256 100 L 392 180 L 392 332 L 256 412 L 120 332 Z" 
        fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Core Pipeline DAG Connectors -->
  <path d="M 160 300 Q 256 360 352 300" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 212 Q 256 150 352 212" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="130" x2="256" y2="380" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Diamond (Spec-Driven Core) -->
  <polygon points="256,180 326,256 256,332 186,256" fill="#1e1b4b" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Central Emblem: Data Engineering Flow / Spark / DB / Spec -->
  <circle cx="256" cy="256" r="28" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="14" fill="#0f172a" />

  <!-- DAG Nodes -->
  <circle cx="160" cy="212" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="160" cy="300" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="352" cy="212" r="20" fill="#0f172a" stroke="#818cf8" stroke-width="5"/>
  <circle cx="352" cy="300" r="20" fill="#0f172a" stroke="#818cf8" stroke-width="5"/>

  <!-- Quality Shield Accent -->
  <path d="M 236 430 L 256 420 L 276 430 L 276 450 Q 256 465 256 465 Q 236 450 236 450 Z" 
        fill="url(#goldGrad)" opacity="0.8"/>
</svg>
